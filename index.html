<style>
/* Layout: one column briefing — guild header, tier key, member board; tapping a member opens their plan (#slug). Deliberately dark (raid console) in both themes. */
:root{
  --bg:#0c1016; --panel:#141a23; --panel2:#1b2330; --line:#2a3443;
  --fg:#e9edf2; --muted:#93a0b2; --gold:#e8c45a; --gold-dim:#8a7432;
  --red:#ff6b62; --blue:#5aa8ff;
  --t0:#4a5566; --t1:#6b7a8f; --t2:#5aa8ff; --t3:#8f7bff; --t4:#e8c45a; --t5:#ff9f43; --t6:#ff6b62; --t7:#ff3fa4;
  --display:'Chakra Petch','Arial Narrow',system-ui,sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px;display:grid;gap:28px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0}
.eyebrow{font-family:var(--display);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.hero{display:grid;gap:14px;padding-block:8px 4px;border-bottom:1px solid var(--line);padding-bottom:26px}
.hero h1{font-size:clamp(30px,6vw,52px);line-height:1.02}
.range{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 16px}
.range b{font-family:var(--display);font-size:clamp(44px,10vw,84px);line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.range span{color:var(--muted);max-width:34ch}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;color:var(--muted)}
.chip strong{color:var(--fg);font-variant-numeric:tabular-nums}
.tierbar{display:flex;height:14px;border-radius:3px;overflow:hidden;background:var(--panel)}
.tierbar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend em{font-style:normal;display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:2px;display:inline-block}
section{display:grid;gap:14px}
section>h2{font-size:22px}
.note{color:var(--muted);font-size:14px;max-width:70ch;margin:0}
.key{overflow-x:auto}
.key table{border-collapse:collapse;width:100%;min-width:520px;font-size:14px;font-variant-numeric:tabular-nums}
.key th,.key td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line)}
.key th{font-family:var(--display);font-weight:600;color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.tb{display:inline-block;min-width:30px;text-align:center;font-family:var(--display);font-weight:700;font-size:12px;padding:2px 6px;border-radius:4px;color:#0c1016}
.search{display:flex;gap:10px;align-items:center}
.search input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:10px 12px;font:inherit}
.search input:focus-visible,a:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.board{display:grid;gap:6px}
.row{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:6px;color:inherit;text-decoration:none}
.row:hover{border-color:var(--gold-dim);background:var(--panel2)}
.rank{font-family:var(--display);color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.who{min-width:0;display:grid;gap:6px}
.who .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{display:flex;gap:3px}
.mini i{width:22px;height:6px;border-radius:2px}
.score{font-family:var(--display);font-weight:600;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.score small{display:block;font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted)}
.back{background:none;border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:8px 12px;font:inherit;cursor:pointer;justify-self:start}
.back:hover{border-color:var(--gold-dim)}
.mhead{display:grid;gap:8px;border-bottom:1px solid var(--line);padding-bottom:18px}
.mhead h1{font-size:clamp(28px,6vw,44px)}
.runs{display:grid;gap:12px}
.run{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--tc);border-radius:6px;padding:14px 16px;display:grid;gap:10px}
.run .top{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;justify-content:space-between}
.run h3{font-size:19px}
.run .rg{font-family:var(--display);font-weight:600;font-size:20px;color:var(--gold);font-variant-numeric:tabular-nums}
.units{display:flex;flex-wrap:wrap;gap:6px}
.u{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:4px 8px;font-size:13px}
.u b{font-family:var(--display);font-size:12px;color:var(--muted);font-weight:600}
.u.lead{border-color:var(--gold-dim)}
.u .ld{font-family:var(--display);font-size:10px;letter-spacing:.1em;color:var(--gold)}
.held,.src{font-size:13px;color:var(--muted)}
.src strong{color:var(--fg);font-weight:500}
.rmods{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:8px}
.tiers{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.rl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);width:100%}.to{color:var(--muted);font-size:13px}
.tp{display:inline-flex;align-items:center;gap:6px;font-size:14px}.tp b{font-family:'Chakra Petch',sans-serif;color:var(--fg)}.tp i{font-style:normal;color:var(--muted);font-size:12px}
.mods li.kp{opacity:.8}
.tord{font-size:13px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px}.tord.bad{border-color:#c9a227;color:var(--fg)}
.kill{border-top:1px solid var(--line);padding-top:10px;display:grid;gap:10px}
.boss{width:100%;aspect-ratio:1672/630;background-size:cover;background-position:center;border-radius:6px;border:1px solid var(--line)}
.ko{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.ks{font-size:13px;color:var(--muted);margin-bottom:6px}.ks strong{color:var(--fg);font-weight:500}
.ko ol{margin:0;padding-left:20px;display:grid;gap:4px;font-size:14px}
.kn{margin:0;font-size:13px;color:var(--muted)}
.rmh{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.held strong{color:var(--fg);font-weight:500}
.mods{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.mods li{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:14px}
.mods a{color:var(--gold)}
.mods .sp{color:var(--muted);font-size:13px;display:block}
footer{color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:16px}
@media (max-width:520px){.row{grid-template-columns:22px minmax(0,1fr) auto;gap:8px}.mini i{width:16px}}
@media (prefers-reduced-motion:no-preference){.row,.back{transition:border-color .15s,background .15s}}
</style>

<script>
document.head.insertAdjacentHTML('beforeend',`<style>.boss{background-image:url(${BOSS})}</style>`);
const killFor=r=>KILL[r.units.length===1?'solo':r.squad]||[];
const killHTML=r=>{const k=killFor(r);if(!k.length)return'';return`<div class="kill"><div class="rmh">Boss and kill order</div><div class="boss" role="img" aria-label="The two droids, with Head 1, Arms 1 and 2 on the left droid and Head 2, Arms 3 and 4 on the right"></div>${k.map(x=>x.none?`<p class="kn">${esc(x.none)}</p>`:`<div class="ko"><div class="ks">From <strong>${esc(x.src)}</strong></div><ol>${x.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></div>`).join('')}</div>`};
const TC=['var(--t0)','var(--t1)','var(--t2)','var(--t3)','var(--t4)','var(--t5)','var(--t6)','var(--t7)'];
const REQ=['No requirement','Gear 11','Relic 2','Relic 4','Relic 6','Relic 8','Relic 9','Relic 10'];
const PTS=[300e3,450e3,600e3,900e3,1.2e6,1.8e6,2.7e6,3.6e6];
const f=p=>p>=1e6?(Math.round(p/1e5)/10+'M'):(p===0?'0':Math.round(p/1e3)+'k');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const app=document.getElementById('app');
const tb=t=>`<span class="tb" style="background:${TC[t]}">T${t}</span>`;
function home(q=''){
  const tot=DATA.tiers, runs=Object.values(tot).reduce((a,b)=>a+b,0);
  const bar=Object.keys(tot).sort().map(t=>`<i style="width:${tot[t]/runs*100}%;background:${TC[t]}" title="Tier ${t}: ${tot[t]} runs"></i>`).join('');
  const leg=Object.keys(tot).sort().map(t=>`<em><span class="dot" style="background:${TC[t]}"></span>Tier ${t}: ${tot[t]} runs</em>`).join('');
  const list=DATA.members.map((m,i)=>({m,i})).filter(({m})=>m.name.toLowerCase().includes(q.toLowerCase()));
  app.innerHTML=`
  <header class="hero">
    <div class="eyebrow">The Republic Lehon · Droid Destruction</div>
    <h1>Lehon Droid Destruction Raid Report</h1>
    <div class="range"><b>${f(DATA.total.lo)}–${f(DATA.total.hi)}</b><span>Guild score range if all ${DATA.members.length} members run their best 5 squads. The top is every squad clearing its highest tier; the bottom is every squad dropping one tier.</span></div>
    <div class="chips">
      <span class="chip"><strong>${DATA.members.length}</strong> members</span>
      <span class="chip"><strong>${runs}</strong> planned runs</span>
      <span class="chip">Average <strong>${f(DATA.total.lo/DATA.members.length)}–${f(DATA.total.hi/DATA.members.length)}</strong> each</span>
      <span class="chip">Rosters from swgoh.gg, <strong>${DATA.pulled}</strong></span>
    </div>
    <div class="tierbar" role="img" aria-label="Planned runs by top tier">${bar}</div>
    <div class="legend">${leg}</div>
  </header>
  ${DATA.changes&&DATA.changes.length?`<section>
    <h2>What changed</h2>
    <ul class="mods">${DATA.changes.slice(0,12).map(c=>`<li><strong>${esc(c.date)}:</strong> ${esc(c.text)}<span class="sp">From ${c.url?`<a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.creator)}</a>`:esc(c.creator)}</span></li>`).join('')}</ul>
  </section>`:''}
  <section>
    <h2>How each plan works</h2>
    <p class="note">Every member gets 5 runs and can use each character once. A squad's top tier is set by its weakest character, and full 5-character squads are needed from Tier 2 up. The score range runs from the tier below to that top tier. Only line-ups shown in creator videos are used, with no other swaps. New Republic hasn't been cleared above Tier 1 in any video, so from Tier 2 up its range is the best posted results (234k–450k). Solos fill spare runs: 4-LOM, Zuckuss, Vader (Duel's End), Kleya or Mara Jade on Tier 0, Rotta up to Tier 1, counted only at Relic 3 or higher, the lowest level shown working. Mod moves are only for characters whose mod set was shown in a video, borrowing a full set from a character not in the raid. They are optional; put them back afterwards.</p>
    <div class="key"><table><thead><tr><th>Tier</th><th>Every character needs</th><th>Points for a full clear</th></tr></thead>
    <tbody>${PTS.map((p,t)=>`<tr><td>${tb(t)}</td><td>${REQ[t]}</td><td>${f(p)}</td></tr>`).join('')}</tbody></table></div>
  </section>
  <section>
    <h2>Members</h2>
    <div class="search"><input id="q" type="search" placeholder="Find your name" value="${esc(q)}" aria-label="Find a member"></div>
    <div class="board">${list.map(({m,i})=>`
      <a class="row" href="#${m.slug}">
        <span class="rank">${i+1}</span>
        <span class="who"><span class="n">${esc(m.name)}</span><span class="mini">${m.runs.map(r=>`<i style="background:${TC[r.tier]}" title="${esc(r.squad)}: Tier ${r.tier}"></i>`).join('')}</span></span>
        <span class="score">${m.lo?f(m.lo)+'–':'up to '}${f(m.hi)}<small>${m.gp}M GP</small></span>
      </a>`).join('')||'<p class="note">No member matches that name.</p>'}</div>
  </section>
  <footer>Estimates from each member's roster and mods on swgoh.gg (${DATA.pulled}). Tier rules from CG's Droid Destruction community update. A top-tier clear also depends on speed, mods and how the run goes.</footer>`;
  const qi=document.getElementById('q');
  qi.addEventListener('input',()=>{const v=qi.value;home(v);const n=document.getElementById('q');n.focus();n.setSelectionRange(v.length,v.length)});
}
function member(m){
  const rank=DATA.members.indexOf(m)+1;
  app.innerHTML=`
  <button class="back" id="back" type="button">← All members</button>
  <header class="mhead">
    <div class="eyebrow">Lehon Droid Destruction Raid Report · #${rank} of ${DATA.members.length}</div>
    <h1>${esc(m.name)}</h1>
    <div class="range"><b>${m.lo?f(m.lo)+'–':'up to '}${f(m.hi)}</b><span>Estimated score across ${m.runs.length} runs · ${m.gp}M GP</span></div>
  </header>
  <section>
    <h2>Your ${m.runs.length} runs</h2>
    <div class="runs">${m.runs.map((r,i)=>`
      <article class="run" style="--tc:${TC[r.tier]}">
        <div class="top"><h3>${i+1}. ${esc(r.squad)}</h3></div>
        <div class="tiers">${r.obs?`<span class="rl">Score range</span><span class="tp">${tb(r.tier)} <b>${f(r.lo)} to ${f(r.hi)}</b> <i>best posted</i></span>`:r.lo&&r.tier>0?`<span class="rl">Score range</span><span class="tp">${tb(r.tier-1)} <b>${f(r.lo)}</b></span><span class="to">to</span><span class="tp">${tb(r.tier)} <b>${f(r.hi)}</b></span>`:`<span class="rl">Score</span><span class="tp">${tb(r.tier)} <b>up to ${f(r.hi)}</b></span>`}</div>
        <div class="units">${r.units.map(u=>`<span class="u${u[2]?' lead':''}">${u[2]?'<span class="ld">LEAD</span>':''}${esc(u[0])} <b>${u[1]}</b></span>`).join('')}</div>
        <div class="src">Team from <strong>${esc(r.src)}</strong></div>
        <div class="held">${r.units.length===1?'':'Top tier set by '}<strong>${esc(r.held)}</strong>${r.tier<7&&r.units.length===5?` · Tier ${r.tier+1} needs ${REQ[r.tier+1]}`:''}</div>
        ${killHTML(r)}
        ${r.mods.length?`<div class="rmods"><div class="rmh">Mods for this team</div>${r.squad==='ISB'||r.squad==='Darth Jar Jar'?`<div class="tord">Fastest mods go first to the character Scrybe Gaming had moving first: ${r.squad==='ISB'?'Dedra, Partagaz, Maul, Snowtrooper Commander, then KX':'The Ronin, Yoda (DSV), Barriss, Jar Jar, then Vader'}. Their speeds are shown for comparison.</div>`:''}<ul class="mods">${r.mods.map(x=>x.act==='move'?`<li class="mv"><strong>${esc(x.to)}:</strong> use <strong>${esc(x.from)}'s</strong> mods (${esc(x.sets)})<span class="sp">about ${x.est} speed after${x.ref?` (Scrybe Gaming ran ${x.ref})`:''} · ${x.spd} from mods${x.now!==null?`, ${x.now} now`:x.n===0?', no mods on now':`, only ${x.n} mods on now`}${x.src?` · ${esc(x.want)} set from ${esc(x.src)}`:x.why?` · ${esc(x.why)}`:''}</span></li>`:`<li class="kp"><strong>${esc(x.to)}:</strong> keep current mods (${esc(x.sets)})<span class="sp">about ${x.est} speed${x.ref?` (Scrybe Gaming ran ${x.ref})`:''} · ${esc(x.why)}${x.src?` (${esc(x.want)} set from ${esc(x.src)})`:''}</span></li>`).join('')}</ul></div>`:''}
      </article>`).join('')}</div>
    <p class="note">Mod moves are optional: creators found most squads cleared on normal mods. Move the whole set from the first character to the second, then put it back after the raid. Speed shown is speed from mods only.</p>
  </section>
  <footer>Estimates from ${esc(m.name)}'s roster and mods on swgoh.gg (${DATA.pulled}). Share this page's link to send this plan.</footer>`;
  document.getElementById('back').addEventListener('click',()=>{location.hash='';});
  window.scrollTo(0,0);
}
function route(){const s=location.hash.slice(1);const m=DATA.members.find(x=>x.slug===s);m?member(m):home();}
window.addEventListener('hashchange',route);route();
</script>
